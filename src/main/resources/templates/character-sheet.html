<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark">
    <title>Guidance D20 - Character Sheet</title>
    <style>
        body { font-family: Arial, sans-serif; background: radial-gradient(circle, #2b2b2b 0%, #111111 100%) !important; color: white; margin: 0; display: flex; min-height: 100vh; color-scheme: dark; }

        .sidebar { background: linear-gradient(to bottom, #800000, #330000) !important; width: 250px; display: flex; flex-direction: column; box-shadow: 2px 0 10px rgba(0,0,0,0.8); z-index: 10; flex-shrink: 0; position: fixed; height: 100vh; }
        .profile-section { text-align: center; margin-bottom: 10px; padding: 20px 20px 0 20px; }
        .profile-pic { width: 80px; height: 80px; background-color: #2b2b2b; border-radius: 50%; margin: 0 auto 10px auto; border: 3px solid #ff9999; box-shadow: 0 0 10px rgba(255, 0, 0, 0.3); object-fit: cover; }
        .btn-create-sm { display: inline-block; margin-top: 10px; color: #ffcccc; font-size: 13px; text-decoration: none; font-weight: bold; padding: 8px 15px; border: 1px solid #ffcccc; border-radius: 15px; transition: 0.2s; background: rgba(0,0,0,0.2); }
        .btn-create-sm:hover { background: #ffcccc; color: #330000; }
        .menu-item { border-bottom: 1px solid rgba(255,255,255,0.1); }
        .menu-item a { display: block; padding: 15px 20px; color: #e6e6e6; text-decoration: none; font-weight: bold; transition: 0.2s; }
        .menu-item a:hover { color: #ffffff; padding-left: 30px; background-color: rgba(255,255,255,0.05); text-shadow: 0 0 5px rgba(255,255,255,0.5); }
        .logout { margin-top: auto; border-top: 1px solid rgba(255,255,255,0.1); }
        .logout a { display: block; padding: 15px 20px; color: #ff6666; text-decoration: none; font-weight: bold; transition: 0.2s; }
        .logout a:hover { color: #ffffff; background-color: rgba(255,0,0,0.1); text-shadow: 0 0 5px #ff0000; }

        .main-content { margin-left: 250px; padding: 40px; flex-grow: 1; display: flex; justify-content: center; }

        .sheet-container { background: rgba(30, 30, 30, 0.9); padding: 40px; border-radius: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.8); width: 100%; max-width: 1000px; border: 1px solid #660000; border-top: 5px solid #cc0000; }
        h1 { color: #ffcccc; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-top: 0; margin-bottom: 30px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }

        .section-title { font-size: 18px; color: #ffcccc; border-bottom: 1px solid #4d0000; padding-bottom: 5px; margin-bottom: 15px; margin-top: 30px; text-transform: uppercase; }

        .header-row { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .input-group { flex: 1; min-width: 120px; display: flex; flex-direction: column; }
        label { font-size: 12px; color: #ff9999; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 1px; }

        /* Added styling for 'select' to match inputs */
        input[type="text"], input[type="number"], textarea, select { padding: 10px; border: 1px solid #4d0000; border-radius: 5px; font-size: 14px; background: rgba(0,0,0,0.5); color: white; transition: border 0.3s; font-family: inherit; }
        input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus { outline: none; border: 1px solid #cc0000; background: rgba(0,0,0,0.8); }
        select option { background: #1a1a1a; color: white; }

        .combat-stats { display: flex; gap: 20px; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 10px; border: 1px solid #4d0000; flex-wrap: wrap; }
        .stats-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 15px; }
        .stat-box { border: 1px solid #660000; border-radius: 10px; text-align: center; padding: 15px 10px; background: rgba(0,0,0,0.4); box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .stat-name { font-weight: bold; color: #ff9999; margin-bottom: 10px; font-size: 14px; }
        .stat-box input { width: 100%; text-align: center; font-size: 24px; font-weight: bold; border: none; background: transparent; padding: 0; color: #ffcccc; box-shadow: none; }
        .stat-box input:focus { border: none; background: transparent; }

        .rp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        textarea { resize: vertical; min-height: 80px; }

        .currency-box { display: flex; gap: 15px; align-items: center; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; border: 1px solid #4d0000; }
        .currency-box .input-group { min-width: 60px; }

        .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 25px; }
        button { background-color: #cc0000; color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        button:hover { background-color: #ff3333; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(204,0,0,0.5); }
        .back-link { color: #999; text-decoration: none; font-weight: bold; transition: color 0.2s; }
        .back-link:hover { color: #ffcccc; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="profile-section">

        <form id="pfp-form" th:action="@{/settings/pfp(username=${username})}" method="post" enctype="multipart/form-data">
            <label for="pfp-upload" class="pfp-label">
                <img th:if="${currentUser != null and currentUser.profilePicture != null}"
                     th:src="'data:image/jpeg;base64,' + ${currentUser.profilePicture}"
                     class="profile-pic" alt="Avatar" />
                <div th:unless="${currentUser != null and currentUser.profilePicture != null}" class="profile-pic"></div>

                <div class="pfp-overlay">UPLOAD</div>
            </label>
            <input type="file" id="pfp-upload" name="file" accept="image/png, image/jpeg" style="display: none;" onchange="document.getElementById('pfp-form').submit();">
        </form>

        <h2 style="margin-bottom: 5px;" th:text="${username} + '!'">User!</h2>
        <a th:href="@{/character-sheet(username=${username})}" class="btn-create-sm">Create Character!</a>
    </div>


    <div class="menu-item"><a th:href="@{/dashboard(username=${username})}">Dashboard</a></div>
    <div class="menu-item"><a th:href="@{/my-characters(username=${username})}">My Characters</a></div>
    <div class="menu-item"><a th:href="@{/wiki(username=${username})}">Wiki</a></div>
    <div class="menu-item"><a th:href="@{/settings(username=${username})}">Settings</a></div>
    <div class="logout"><a th:href="@{/login}">Log out</a></div>
</div>

<div class="main-content">
    <div class="sheet-container">
        <h1 th:text="${sheet.id == null ? 'Forge New Character' : 'Update Character'}">Character Sheet</h1>

        <form th:action="@{/character-sheet(username=${username})}" th:object="${sheet}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="section-title">Identity</div>

            <div class="header-row">
                <div class="input-group" style="flex: 2;">
                    <label>Character Name</label>
                    <input type="text" th:field="*{name}" required>
                </div>
                <div class="input-group">
                    <label>Class</label>
                    <select th:field="*{characterClass}" required>
                        <option value="">Select Class</option>
                        <option th:each="c : ${availableClasses}" th:value="${c.name}" th:text="${c.name}"></option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Level</label>
                    <input type="number" th:field="*{level}" min="1" max="20" required>
                </div>
            </div>

            <div class="header-row">
                <div class="input-group">
                    <label>Race</label>
                    <select th:field="*{race}" required>
                        <option value="">Select Race</option>
                        <option th:each="r : ${availableRaces}" th:value="${r}" th:text="${r}"></option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Background</label>
                    <select th:field="*{background}">
                        <option value="">Select Background</option>
                        <option th:each="b : ${availableBackgrounds}" th:value="${b}" th:text="${b}"></option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Alignment</label>
                    <select th:field="*{alignment}">
                        <option value="">Select Alignment</option>
                        <option th:each="a : ${availableAlignments}" th:value="${a}" th:text="${a}"></option>
                    </select>
                </div>
            </div>

            <div class="section-title">Status & Combat</div>
            <div class="combat-stats">
                <div class="input-group">
                    <label>Armor Class</label>
                    <input type="number" th:field="*{armorClass}">
                </div>
                <div class="input-group">
                    <label style="color: #00cc44;">Current HP</label>
                    <input type="number" th:field="*{currentHp}">
                </div>
                <div class="input-group">
                    <label>Max HP</label>
                    <input type="number" th:field="*{maxHitPoints}">
                </div>
                <div class="input-group">
                    <label style="color: #33ccff;">Temp HP</label>
                    <input type="number" th:field="*{tempHp}">
                </div>
                <div class="input-group">
                    <label>Hit Dice</label>
                    <input type="text" th:field="*{hitDice}" placeholder="e.g. 3d10">
                </div>
                <div class="input-group">
                    <label>Speed (ft)</label>
                    <input type="number" th:field="*{speed}">
                </div>
                <div class="input-group">
                    <label style="color: #ffcc00;">Inspiration</label>
                    <input type="number" th:field="*{inspiration}" min="0">
                </div>
            </div>

            <div class="section-title">Attributes</div>
            <div class="stats-grid">
                <div class="stat-box"><div class="stat-name">STR</div><input type="number" th:field="*{strength}" min="1" max="30"></div>
                <div class="stat-box"><div class="stat-name">DEX</div><input type="number" th:field="*{dexterity}" min="1" max="30"></div>
                <div class="stat-box"><div class="stat-name">CON</div><input type="number" th:field="*{constitution}" min="1" max="30"></div>
                <div class="stat-box"><div class="stat-name">INT</div><input type="number" th:field="*{intelligence}" min="1" max="30"></div>
                <div class="stat-box"><div class="stat-name">WIS</div><input type="number" th:field="*{wisdom}" min="1" max="30"></div>
                <div class="stat-box"><div class="stat-name">CHA</div><input type="number" th:field="*{charisma}" min="1" max="30"></div>
            </div>

            <div class="section-title">Roleplay & Traits</div>
            <div class="rp-grid">
                <div class="input-group">
                    <label>Personality Traits</label>
                    <textarea th:field="*{personalityTraits}"></textarea>
                </div>
                <div class="input-group">
                    <label>Ideals</label>
                    <textarea th:field="*{ideals}"></textarea>
                </div>
                <div class="input-group">
                    <label>Bonds</label>
                    <textarea th:field="*{bonds}"></textarea>
                </div>
                <div class="input-group">
                    <label>Flaws</label>
                    <textarea th:field="*{flaws}"></textarea>
                </div>
            </div>

            <div class="section-title">Features, Proficiencies & Inventory</div>
            <div class="rp-grid">
                <div class="input-group">
                    <label>Features & Traits</label>
                    <textarea th:field="*{featuresAndTraits}" style="min-height: 120px;"></textarea>
                </div>
                <div class="input-group">
                    <label>Proficiencies & Languages</label>
                    <textarea th:field="*{proficienciesAndLanguages}" style="min-height: 120px;"></textarea>
                </div>
            </div>

            <div class="currency-box" style="margin-top: 20px;">
                <label style="margin-bottom: 0; margin-right: 15px;">Wealth:</label>
                <div class="input-group">
                    <label style="color: #b87333;">CP</label>
                    <input type="number" th:field="*{copper}" min="0">
                </div>
                <div class="input-group">
                    <label style="color: #c0c0c0;">SP</label>
                    <input type="number" th:field="*{silver}" min="0">
                </div>
                <div class="input-group">
                    <label style="color: #50c878;">EP</label>
                    <input type="number" th:field="*{electrum}" min="0">
                </div>
                <div class="input-group">
                    <label style="color: #ffd700;">GP</label>
                    <input type="number" th:field="*{gold}" min="0">
                </div>
                <div class="input-group">
                    <label style="color: #e5e4e2;">PP</label>
                    <input type="number" th:field="*{platinum}" min="0">
                </div>
            </div>

            <div class="input-group" style="margin-top: 20px;">
                <label>Equipment & Notes</label>
                <textarea th:field="*{notes}" style="min-height: 150px;"></textarea>
            </div>

            <div class="actions">
                <a th:href="@{/my-characters(username=${username})}" class="back-link">Return without saving</a>
                <button type="submit" th:text="${sheet.id == null ? 'Create Character' : 'Save Changes'}">Save</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
