<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Guidance D20 - Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: linear-gradient(to bottom, #fff, #ffcccc); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 15px rgba(255, 0, 0, 0.2); width: 300px; text-align: center; border: 2px solid #cc0000; }
        h1 { color: #333; font-size: 24px; }
        .logo { color: #cc0000; font-weight: bold; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #cc0000; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background-color: #990000; }
        .links { margin-top: 15px; font-size: 12px; }
        .links a { color: #cc0000; text-decoration: none; }
        .error { color: red; font-size: 12px; }
    </style>
</head>
<body>
<div class="card">
    <h1>Guidance<span class="logo">D20</span></h1>
    <p th:if="${error}" class="error" th:text="${error}"></p>
    <form th:action="@{/login}" method="post">
        <input type="text" name="username" placeholder="Email/Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <div style="text-align: left; font-size: 12px; margin-bottom: 10px;">
            <input type="checkbox" id="remember" name="remember">
            <label for="remember">Remember me, Lathander</label>
        </div>
        <button type="submit">Log in</button>
    </form>
    <div class="links">
        You don't have an account? Go to <a th:href="@{/signup}">sign up</a>, adventurer!
    </div>
</div>
</body>
</html>
