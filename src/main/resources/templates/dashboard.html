<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Guidance D20 - Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; display: flex; height: 100vh; background: #f4f4f4; }
        .sidebar { background: linear-gradient(to bottom, #b30000, #4d0000); color: white; width: 250px; padding: 20px; display: flex; flex-direction: column; }
        .profile-section { text-align: center; margin-bottom: 30px; }
        .profile-pic { width: 80px; height: 80px; background-color: #ddd; border-radius: 50%; margin: 0 auto 10px auto; border: 3px solid white; }
        .menu-item { padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.2); cursor: pointer; }
        .menu-item:hover { color: #ffcccc; }
        .logout { margin-top: auto; cursor: pointer; font-weight: bold; }
        .main-content { flex-grow: 1; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #fff 0%, #ffcccc 100%); position: relative; }
        .d20-menu { position: relative; width: 400px; height: 400px; }
        .d20-segment { position: absolute; font-weight: bold; font-size: 24px; color: #660000; text-transform: uppercase; cursor: pointer; text-shadow: 1px 1px 2px white; }
        .seg-top { top: 20%; left: 35%; }
        .seg-mid { top: 45%; left: 35%; font-size: 30px; }
        .seg-left { top: 60%; left: 15%; }
        .seg-right { top: 60%; right: 15%; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="profile-section">
        <div class="profile-pic"></div>
        <h2 th:text="${username} + '!'">User!</h2>
        <a href="#" style="color: white; font-size: 12px;">Check your stuff!</a>
    </div>
    <div class="menu-item">Account</div>
    <div class="menu-item">Messages (3)</div>
    <div class="menu-item">Settings</div>
    <div class="logout">
        <a th:href="@{/login}" style="color: white; text-decoration: none;">Log out</a>
    </div>
</div>
<div class="main-content">
    <div class="d20-menu">
        <div class="d20-segment seg-top">Community</div>
        <div class="d20-segment seg-mid">Spell<br>Helper</div>
        <div class="d20-segment seg-left">Misc</div>
        <div class="d20-segment seg-right">Wiki</div>
    </div>
</div>
</body>
</html>
