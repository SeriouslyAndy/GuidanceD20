<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Guidance D20 - Sign Up</title>
    <style>
        body { font-family: Arial, sans-serif; background: linear-gradient(to bottom, #fff, #ffcccc); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 15px rgba(255, 0, 0, 0.2); width: 300px; text-align: center; border: 2px solid #cc0000; }
        h1 { color: #333; font-size: 24px; }
        .logo { color: #cc0000; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #cc0000; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        button:hover { background-color: #990000; }
        .links { margin-top: 15px; font-size: 12px; }
        .links a { color: #cc0000; text-decoration: none; }
    </style>
</head>
<body>
<div class="card">
    <h1>Guidance<span class="logo">D20</span></h1>
    <form th:action="@{/signup}" method="post">
        <input type="email" name="email" placeholder="Email" required>
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Sign up</button>
    </form>
    <div class="links">
        Already have an account? Go to <a th:href="@{/login}">log in</a>.
    </div>
</div>
</body>
</html>
